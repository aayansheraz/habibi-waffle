<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Habibi Waffle, Lahore - famous for creamy waffles & ice cream, plus Chinese and fast food. Special injected broast, pizza & wraps."
    />
    <title>Habibi Waffle &middot; Lahore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Draco decoder (3D models) is fetched from gstatic at runtime -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Zanderio Chatbot Widget (Secure Sandbox) -->
    <iframe
      id="zanderio-chat-frame"
      title="Chat Support"
      srcdoc="
        <!DOCTYPE html>
        <html lang='en'>
        <head>
          <meta charset='UTF-8'>
          <style>
            html, body {
              margin: 0;
              padding: 0;
              width: 100%;
              height: 100%;
              background: transparent;
              overflow: hidden;
            }
          </style>
          <script src='https://cdn.zanderio.ai/widget/loader.js' data-id='wdg_yvAsqIUadSx62GV4Qm9us1rR' defer></script>
          <script>
            (function() {
              function fixAvatars(root) {
                if (!root) return;
                try {
                  root.querySelectorAll('img').forEach(function(img) {
                    var p = (img.parentElement ? img.parentElement.className : '') + ' ' + (img.className || '');
                    if (p.indexOf('avatar') !== -1 || p.indexOf('launcher') !== -1 || p.indexOf('header') !== -1 || p.indexOf('brand') !== -1) {
                      if (img.src && img.src.indexOf('logo-habibi-light.webp') === -1) {
                        img.src = '/images/logo-habibi-light.webp';
                      }
                      img.style.objectFit = 'contain';
                      img.style.padding = '4px';
                      img.style.boxSizing = 'border-box';
                    }
                  });
                } catch (e) {}
              }

              function cleanRoot(root) {
                if (!root) return;
                fixAvatars(root);
                try {
                  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                  var node;
                  while ((node = walker.nextNode())) {
                    if (node.nodeValue && /\bSix\b/i.test(node.nodeValue)) {
                      node.nodeValue = node.nodeValue.replace(/\bSix\b\s*/gi, '').replace(/\s+/g, ' ').trim();
                    }
                  }
                } catch (e) {}
              }

              function observeRoot(root) {
                if (!root || root.__cleaned) return;
                root.__cleaned = true;
                cleanRoot(root);
                var observer = new MutationObserver(function() { cleanRoot(root); });
                observer.observe(root, { childList: true, subtree: true, characterData: true });
              }

              var origAttach = Element.prototype.attachShadow;
              Element.prototype.attachShadow = function(init) {
                var shadow = origAttach.call(this, init);
                observeRoot(shadow);
                return shadow;
              };

              setInterval(function() {
                cleanRoot(document.body || document.documentElement);
                var all = document.querySelectorAll('*');
                for (var i = 0; i < all.length; i++) {
                  if (all[i].shadowRoot) observeRoot(all[i].shadowRoot);
                }
              }, 50);
            })();
          </script>
        </head>
        <body></body>
        </html>
      "
      sandbox="allow-scripts allow-forms allow-same-origin"
      style="
        position: fixed;
        bottom: 0;
        right: 0;
        width: 420px;
        height: 680px;
        border: none;
        z-index: 999999;
        background: transparent;
      "
    ></iframe>
  </body>
</html>
